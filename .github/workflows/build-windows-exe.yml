name: Build Windows EXE

# Builds a standalone QuoteTracker.exe on a real Windows runner and uploads it
# as a downloadable artifact. Runs on every push to the app branch and can be
# started manually from the Actions tab (Run workflow).

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name QuoteTracker
          --icon assets/icon.ico
          --add-data "assets;assets"
          --collect-all tkinterdnd2
          --collect-all pdfplumber
          --collect-all pdfminer
          --collect-submodules openpyxl
          run.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuoteTracker-windows
          path: dist/QuoteTracker.exe
          if-no-files-found: error
